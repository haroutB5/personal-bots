# Run the live server from the permanent runtime checkout instead of the
# disposable builder worktree `_wt/hbots-linux-ops`.
#
# Ship-time drop-in, installed by DevOps as
#   ~/.config/systemd/user/hbots.service.d/20-runtime-path.conf
# beside the existing 10-opencode-path.conf. It deliberately leaves
# EnvironmentFile and the PATH drop-in untouched: systemd merges those from the
# main unit and 10-opencode-path.conf.
[Unit]
Documentation=
Documentation=file:///home/harout/Claude/AI/hbots-runtime/scripts/personal/README.md
ConditionPathExists=
ConditionPathExists=/home/harout/Claude/AI/hbots-runtime/scripts/personal/node/hbots.mjs

[Service]
WorkingDirectory=/home/harout/Claude/AI/hbots-runtime
# An empty assignment clears the ExecStart inherited from hbots.service.
ExecStart=
ExecStart=/home/harout/.local/share/mise/installs/node/24.22.1/bin/node /home/harout/Claude/AI/hbots-runtime/scripts/personal/node/hbots.mjs serve --root dev
