plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.hbotsshare'
version = '0.0.1'

android {
  namespace 'expo.modules.hbotsshare'
  defaultConfig {
    minSdkVersion 26
    versionCode 1
    versionName '0.0.1'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.17.0'
  // Alpha: the only published version of the view wrapper (14 Nov 2026). Pinned exactly.
  implementation 'androidx.photopicker:photopicker-embedded:1.0.0-alpha03'
  testImplementation 'junit:junit:4.13.2'
}
