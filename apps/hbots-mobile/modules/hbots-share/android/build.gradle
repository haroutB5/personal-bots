plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.hbotsshare'
version = '0.0.1'

android {
  namespace 'expo.modules.hbotsshare'
  defaultConfig {
    minSdkVersion 26
    versionCode 1
    versionName '0.0.1'
  }
  testOptions {
    unitTests.includeAndroidResources = true
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.17.0'
  // Alpha, pinned exactly. 1.0.0-alpha03 (renamed photopicker-embedded) needs compileSdk 37 and
  // Android Gradle plugin 9.1; this artifact has the same EmbeddedPhotoPickerView for 36 and 8.12.
  implementation 'androidx.photopicker:photopicker:1.0.0-alpha02'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.14.1'
}
