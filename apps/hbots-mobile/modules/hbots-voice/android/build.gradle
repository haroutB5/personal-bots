plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.hbotsvoice'
version = '0.0.1'

android {
  namespace 'expo.modules.hbotsvoice'
  defaultConfig {
    minSdkVersion 26
    versionCode 1
    versionName '0.0.1'
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'

  testImplementation 'junit:junit:4.13.2'
}
