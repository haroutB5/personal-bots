plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.hbotsupdater'
version = '0.0.1'

def testPin = System.getenv('HBOTS_UPDATE_TEST_PIN')?.trim() ?: ''
def pinFile = project.file('../../../release-cert.sha256')
def releasePin = pinFile.isFile() ? pinFile.text.trim() : ''
def releaseBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (releaseBuild && !testPin.isEmpty()) {
  throw new GradleException('HBOTS_UPDATE_TEST_PIN cannot be set for a release build')
}
def effectivePin = testPin.isEmpty() ? releasePin : testPin
if (releaseBuild && effectivePin.isEmpty()) {
  throw new GradleException('A release build needs release-cert.sha256')
}
def idleMinutes = (System.getenv('HBOTS_UPDATE_IDLE_MINUTES') ?: '10').toInteger()
if (idleMinutes < 1 || idleMinutes > 60) {
  throw new GradleException('HBOTS_UPDATE_IDLE_MINUTES must be 1 to 60')
}
def pinTestFile = project.findProperty('hbotsPinFile') ?: pinFile.absolutePath

// A changed pin must regenerate BuildConfig, or an incremental release keeps the old one.
tasks.matching { it.name.startsWith('generate') && it.name.endsWith('BuildConfig') }.configureEach {
  inputs.file(pinFile).optional()
}

android {
  namespace 'expo.modules.hbotsupdater'
  defaultConfig {
    minSdkVersion 26
    versionCode 1
    versionName '0.0.1'
    buildConfigField 'String', 'RELEASE_CERT_SHA256', "\"${effectivePin.isEmpty() ? '0' * 64 : effectivePin}\""
    buildConfigField 'boolean', 'UPDATE_TEST_PIN', testPin.isEmpty() ? 'false' : 'true'
    buildConfigField 'int', 'UPDATE_IDLE_MINUTES', idleMinutes.toString()
  }
  sourceSets {
    main {
      manifest.srcFile System.getenv('HBOTS_UPDATE_TAP_FALLBACK') == '1'
        ? 'src/main/AndroidManifestTapFallback.xml'
        : 'src/main/AndroidManifest.xml'
    }
  }
  testOptions {
    unitTests.all {
      systemProperty 'fixtures.dir', file('src/test/resources/apks').absolutePath
      systemProperty 'fixtures.work', file("$buildDir/fixtures-work").absolutePath
      systemProperty 'release.pin.file', pinTestFile
    }
  }
}

dependencies {
  implementation 'com.android.tools.build:apksig:8.7.3'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
